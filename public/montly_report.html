<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>In-Clinic Space Rental Monthly Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body { background: white !important; }
      .no-print { display: none !important; }
      .slide-container { border: none !important; box-shadow: none !important; margin: 0 !important; page-break-after: always; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- TOP NAVBAR -->
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm no-print">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="/index.html" class="bg-slate-200 hover:bg-slate-300 text-slate-800 px-3 py-1.5 rounded-lg text-xs font-bold transition">
          ← Back to Master List
        </a>
        <h1 class="text-sm font-bold text-slate-800">In-Clinic Space Rental Project - Monthly Report</h1>
      </div>
      <div>
        <button onclick="window.print()" class="bg-slate-800 hover:bg-black text-white px-4 py-2 rounded-lg text-xs font-bold transition">
          🖨️ Export Slide / Print PDF
        </button>
      </div>
    </div>
  </nav>

  <!-- MAIN REPORT CONTAINER -->
  <main class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
    <div id="reportSlideView" class="space-y-6">
      <!-- Dynamically populated PowerPoint Slide card -->
    </div>
  </main>

  <script>
    let token = sessionStorage.getItem('clinic_token');
    if (!token) window.location.href = '/index.html';

    window.addEventListener('DOMContentLoaded', () => {
      loadSingleClinicReport();
    });

    async function loadSingleClinicReport() {
      const params = new URLSearchParams(window.location.search);
      const targetRef = params.get('ref');

      try {
        const res = await fetch('/api/masterlist', { headers: { Authorization: `Bearer ${token}` } });
        if (!res.ok) return;
        const records = await res.json();

        const record = records.find(r => r.sr_ref_no === targetRef) || records[0];
        const container = document.getElementById('reportSlideView');

        if (!record) {
          container.innerHTML = `<div class="bg-white p-8 rounded-xl text-center text-slate-400">No report found for REF: ${targetRef || 'Unknown'}</div>`;
          return;
        }

        const photos = record.photos || [];

        container.innerHTML = `
          <div class="bg-white border-2 border-slate-300 rounded-2xl shadow-xl p-8 space-y-6 slide-container">
            <!-- Header Section matching PPT -->
            <div class="border-b-2 border-slate-800 pb-4 flex justify-between items-start">
              <div>
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-widest">In-Clinic Space Rental Project • Monthly Report Year 2026</h2>
                <h3 class="text-base font-bold text-slate-800 mt-1">NSO : ${record.ne_name || 'EVELYN TAN'}</h3>
              </div>
              <div class="text-right">
                <span class="bg-blue-100 text-blue-800 text-xs font-black px-3 py-1 rounded">SLIDE VIEW</span>
              </div>
            </div>

            <!-- Clinic Title & Details Block -->
            <div class="space-y-2">
              <h2 class="text-xl font-black text-slate-900">${record.clinic_name}</h2>
              <p class="text-xs font-semibold text-slate-600">(${record.payee_name || record.clinic_name})</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 border p-4 rounded-xl text-xs">
              <div>
                <p><b>Ref:</b> <span class="font-mono font-bold text-blue-600">${record.sr_ref_no}</span></p>
                <p class="mt-1"><b>Duration:</b> ${record.start_date || '-'} to ${record.end_date || '-'}</p>
              </div>
              <div>
                <p><b>Amount Paid:</b> <span class="text-emerald-700 font-bold">RM ${Number(record.total_amount || 0).toFixed(2)}</span></p>
                <p class="mt-1"><b>Material Placed:</b> ${record.material_details || 'Standard POSM'}</p>
              </div>
            </div>

            <!-- Proof of Materials / Photos Grid -->
            <div>
              <h4 class="font-bold text-xs uppercase tracking-wider text-slate-700 mb-3">Proofs of Materials & Monthly Photos</h4>
              ${photos.length === 0 ? `
                <div class="border-2 border-dashed rounded-xl p-8 text-center text-slate-400 text-xs italic">
                  No proof photos attached to this record yet. Use 'Upload Document', 'Submit Agreement', or 'Upload Monthly Proof' from the dashboard to add photos.
                </div>
              ` : `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  ${photos.map((p, idx) => `
                    <div class="border rounded-xl overflow-hidden bg-white shadow-sm space-y-2 p-3">
                      <div class="flex justify-between items-center text-[11px] bg-slate-800 text-white px-2.5 py-1.5 rounded">
                        <span><b>Photo #${idx + 1}: ${p.doc_type || 'Proof'}</b></span>
                        <span class="text-emerald-300">${p.photo_date || ''}</span>
                      </div>
                      <div class="border rounded-lg bg-slate-100 p-2 flex justify-center">
                        <img src="${p.file_path}" alt="Material Proof" class="max-h-64 object-contain" />
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>

            <div class="border-t pt-4 text-right text-[11px] text-slate-400 font-mono">
              Genesis Adun Sdn Bhd • System Generated Report
            </div>
          </div>
        `;
      } catch (err) {
        console.error(err);
      }
    }

    function logout() {
      sessionStorage.clear();
      location.href = '/index.html';
    }
  </script>
</body>
</html>
